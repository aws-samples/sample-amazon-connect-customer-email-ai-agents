AWSTemplateFormatVersion: '2010-09-09'
Description: 'S3 buckets for Amazon Connect Customer email storage and AI agents knowledge base (PoC)'

Parameters:
  ConnectInstanceArn:
    Type: String
    Description: 'ARN of your existing Amazon Connect Customer instance'
    AllowedPattern: '^arn:aws:connect:[a-z0-9-]+:\d{12}:instance/[a-f0-9-]+$'

  ConnectInstanceAlias:
    Type: String
    Description: 'Your instance alias (used to name the S3 buckets)'
    AllowedPattern: '^[a-zA-Z0-9-]+$'
    MaxLength: 27
    ConstraintDescription: >-
      Must be 27 characters or fewer. The alias is combined with a suffix and your
      12-digit account ID to form the bucket name, which S3 limits to 63 characters.

  CreateEmailStorageBucket:
    Type: String
    Description: >-
      Create the email storage bucket. Set to false if your instance already has an
      Amazon S3 bucket associated for email messages and attachments and you want to
      keep using it. Only the knowledge base bucket is created when false.
    Default: 'true'
    AllowedValues: ['true', 'false']

Conditions:
  CreateEmailBucket: !Equals [!Ref CreateEmailStorageBucket, 'true']

Resources:
  # Bucket 1: Email message + attachment storage (consumed by the email channel).
  # Optional. Amazon Connect Customer creates a bucket of its own when you enable
  # email, but that bucket has no CORS rule. This one ships with the CORS rule that
  # attachment sharing requires.
  EmailStorageBucket:
    Type: AWS::S3::Bucket
    Condition: CreateEmailBucket
    Properties:
      BucketName: !Sub '${ConnectInstanceAlias}-connect-email-storage-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: ['PUT', 'GET']
            AllowedOrigins:
              - '*.my.connect.aws'
              - '*.awsapps.com'
            MaxAge: 3000

  EmailStorageBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateEmailBucket
    Properties:
      Bucket: !Ref EmailStorageBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowConnectObjectAccess
            Effect: Allow
            Principal:
              Service: connect.amazonaws.com
            Action:
              - 's3:GetObject'
              - 's3:PutObject'
              - 's3:DeleteObject'
            Resource: !Sub '${EmailStorageBucket.Arn}/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnEquals:
                'aws:SourceArn': !Ref ConnectInstanceArn
          - Sid: AllowConnectListBucket
            Effect: Allow
            Principal:
              Service: connect.amazonaws.com
            Action: 's3:ListBucket'
            Resource: !GetAtt EmailStorageBucket.Arn
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
              ArnEquals:
                'aws:SourceArn': !Ref ConnectInstanceArn
          # Defense in depth. Amazon Connect Customer and the AWS SDKs already use
          # HTTPS, so this denies a request path nothing here uses. Maps to AWS
          # Security Hub control S3.5.
          - Sid: RestrictToTLSRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt EmailStorageBucket.Arn
              - !Sub '${EmailStorageBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  # Bucket 2: Knowledge base content source (ingested by the AI agents domain).
  # Always created.
  KnowledgeBaseContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ConnectInstanceAlias}-connect-kb-content-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: 'AES256'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # This bucket needs no grants: the AI agents S3 integration reads it through an
  # IAM service role, not a resource policy. The policy exists only to enforce TLS.
  KnowledgeBaseContentBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KnowledgeBaseContentBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: RestrictToTLSRequestsOnly
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt KnowledgeBaseContentBucket.Arn
              - !Sub '${KnowledgeBaseContentBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  EmailStorageBucketName:
    Condition: CreateEmailBucket
    Description: 'S3 bucket for email messages and attachments. Point Data storage at this in Step 2.'
    Value: !Ref EmailStorageBucket

  KnowledgeBaseContentBucketName:
    Description: 'S3 bucket for AI agents knowledge base content. Upload your documents here in Step 3.'
    Value: !Ref KnowledgeBaseContentBucket
